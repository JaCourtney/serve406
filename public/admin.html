<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serve406 — Admin Panel</title>
  <link rel="icon" href="https://serve406.org/wp-content/uploads/2025/02/4-1-300x300.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .admin-toolbar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .admin-toolbar input,
    .admin-toolbar select {
      width: auto;
      flex: 1;
      min-width: 160px;
      max-width: 280px;
    }

    .admin-toolbar .btn {
      width: auto;
      padding: 10px 24px;
      font-size: 0.9rem;
    }

    .count-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      color: #64748b;
    }

    .count-bar strong {
      color: var(--navy);
      font-size: 1rem;
    }

    .table-wrap {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(6, 21, 46, 0.09);
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background: var(--navy);
      color: white;
    }

    thead th {
      padding: 0.9rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-light); }

    tbody td {
      padding: 0.85rem 1rem;
      color: var(--body-text);
      vertical-align: middle;
    }

    tbody td:first-child { font-weight: 500; color: var(--navy); }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html">
        <img class="nav-logo" src="https://serve406.org/wp-content/uploads/2025/02/4.png" alt="Serve406 logo" />
      </a>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span id="nav-email" class="nav-email"></span>
        <button id="logout-btn" class="btn btn-danger" style="width:auto;padding:8px 18px;font-size:0.85rem;">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-container">

    <div style="margin-bottom:1.5rem;">
      <p class="section-title">Admin Panel</p>
      <h2 style="margin-bottom:0;">Volunteer Registrations</h2>
    </div>

    <div class="admin-toolbar">
      <input type="text" id="search" placeholder="Search by name or phone…" />
      <select id="area-filter">
        <option value="">All Areas</option>
        <option value="North">North</option>
        <option value="South">South</option>
        <option value="East">East</option>
        <option value="West">West</option>
        <option value="Central">Central / Downtown</option>
      </select>
      <button id="export-btn" class="btn btn-primary">Export CSV</button>
    </div>

    <div class="count-bar">
      <span>Total: <strong id="total-count">—</strong> registrations</span>
      <span id="filtered-count" style="color:var(--primary);font-weight:500;"></span>
    </div>

    <div class="table-wrap" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Phone</th>
            <th>Church</th>
            <th>Area</th>
            <th>Registered</th>
          </tr>
        </thead>
        <tbody id="reg-tbody">
          <tr>
            <td colspan="5" style="text-align:center;color:#94a3b8;padding:2rem;">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
