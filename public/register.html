<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serve406 — Register</title>
  <link rel="icon" href="https://serve406.org/wp-content/uploads/2025/02/4-1-300x300.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 480px) {
      .name-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="form-header">
    <a href="index.html">
      <img src="https://serve406.org/wp-content/uploads/2025/02/4.png" alt="Serve406 logo" />
    </a>
  </div>

  <div class="container">
    <div class="card">
      <h2>Create your volunteer account</h2>

      <div id="alert" class="alert" style="display:none;"></div>

      <form id="register-form" novalidate>

        <div class="name-row">
          <div class="form-group">
            <label for="first-name">First Name <span style="color:#dc2626">*</span></label>
            <input type="text" id="first-name" placeholder="Jane" required />
          </div>
          <div class="form-group">
            <label for="last-name">Last Name <span style="color:#dc2626">*</span></label>
            <input type="text" id="last-name" placeholder="Smith" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span style="color:#dc2626">*</span></label>
          <input type="email" id="email" placeholder="jane@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="(406) 555-0100" />
        </div>

        <div class="form-group">
          <label for="church">Church</label>
          <input type="text" id="church" placeholder="e.g. Cornerstone Church" required />
        </div>

        <div class="form-group">
          <label for="location">Location <span style="color:#dc2626">*</span></label>
          <select id="location" required>
            <option value="" disabled selected>Loading locations…</option>
          </select>
        </div>

        <div class="form-group">
          <label for="support-preference">Support Preference</label>
          <select id="support-preference">
            <option value="No Preference" selected>No Preference</option>
            <option value="Public Places">Public Places</option>
            <option value="Schools">Schools</option>
            <option value="Churches">Churches</option>
            <option value="Residences">Residences</option>
          </select>
        </div>

        <div class="form-group">
          <label for="considerations">Considerations</label>
          <select id="considerations">
            <option value="No Considerations" selected>No Considerations</option>
            <option value="Family Friendly">Family Friendly</option>
            <option value="Skill">Skill</option>
            <option value="Outdoors">Outdoors</option>
            <option value="Indoors">Indoors</option>
            <option value="Wheelchair Accessible">Wheelchair Accessible</option>
            <option value="Team Project">Team Project</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password <span style="color:#dc2626">*</span></label>
          <input type="password" id="password" placeholder="At least 6 characters" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password <span style="color:#dc2626">*</span></label>
          <input type="password" id="confirm-password" placeholder="Repeat your password" required />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">Create Account</button>
      </form>

      <p class="link-text">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
